# ============================================================
#  ROUT — konfigurasi
#  Salin file ini menjadi config.conf, lalu atur PIN:  lock-pin
#  Ubah nilai, simpan. Tidak perlu restart.
# ============================================================

# Aktifkan / matikan fitur lock (1 = aktif, 0 = mati)
enabled=1

# Izinkan buka pakai PIN (1 = ya)
allow_pin=1

# Tampilkan jam & tanggal (1 = ya)
show_clock=1
show_date=1

# Tampilkan banner "Welcome to Termux!" (MOTD) setelah layar kunci dibuka.
# MOTD tetap disembunyikan SEBELUM layar kunci oleh ~/.hushlogin.
# Set 0 kalau banner itu tidak diinginkan.
show_motd=1

# Blokir lock berulang lewat penanda state (1 = ya, 0 = jangan pernah blokir).
# Harus 0 supaya idle-lock bisa terpicu berkali-kali dalam satu sesi.
lock_once_per_open=0

# Teks judul di layar kunci
message=ROUT

# Warna (R,G,B). Termux mendukung truecolor.
color_bg=16,16,26
color_fg=226,226,238
color_accent=255,86,120
color_dim=130,130,150
color_err=255,120,120

# Panjang minimal PIN (angka)
pin_min_len=4

# Sakelar darurat: file "termux-lock-status.txt" di folder ini.
#   1 = lock aktif (normal)
#   0 = lock DILEWATI (bisa masuk Termux & reset PIN dari dalam)
# Baris ini: 1 = aktifkan sakelar, 0 = matikan fitur sakelar.
panic_file=1

# Keypad angka di layar kunci (1 = tampil, 0 = pakai keyboard saja).
# Ukuran tombol mengikuti lebar layar. Butuh >= 26 kolom & 18 baris.
pin_keypad=1

# Tombol tambahan di keypad: "R lupa" & "Q tutup" (1 = ya, 0 = angka saja)
keypad_close=1

# Tampilkan petunjuk cara menyembunyikan keyboard HP (1 = ya, 0 = tidak)
keypad_kbd_hint=1

# Warna latar tombol keypad (R,G,B)
color_key=40,40,58

# --- Bagian ini diisi otomatis oleh: lock.sh set-pin ---
# JANGAN diedit manual.
pin_salt=
pin_hash=
recovery_salt=
recovery_hash=
